# ===== ClickHouse =====
ch.endpoint=http://localhost:8123
ch.username=default
# ????? ${CH_PASSWORD} ??????
ch.password=${CH_PASSWORD:123456}
ch.database=pcap_db
ch.table=parseData
ch.metaTable=processed_files

# ===== FileScan =====
scan.rootDir=C:/Users/liuliu/Desktop/parseData
scan.intervalSeconds=30
scan.maxDepth=3
file.stableCheck=true

# ===== ??????? =====
# concurrency=1 ??????
scan.concurrency=4
scan.threadPool.queueSize=256
scan.threadPool.keepAliveSeconds=60

# ===== arg =====
batch.size=500
retry.max=3

# ===== log =====
logging.level.com.liuliu.example.decode=INFO

# ===== Actuator / Micrometer =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
