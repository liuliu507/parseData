# ===== ClickHouse =====
ch.endpoint=http://localhost:8123
ch.username=default
# 真实项目用 ${CH_PASSWORD} 环境变量注入，默认值是本地开发弱密码
ch.password=${CH_PASSWORD:123456}
ch.database=pcap_db
ch.table=parseData
ch.metaTable=processed_files

# ===== FileScan =====
scan.rootDir=C:/Users/liuliu/Desktop/parseData
scan.intervalSeconds=30
scan.maxDepth=3
file.stableCheck=true

# ===== 文件级并行处理 =====
# concurrency=1 即单线程串行（ThreadPoolExecutor(1,1,...) 效果等价）
scan.concurrency=4
scan.threadPool.queueSize=256
scan.threadPool.keepAliveSeconds=60

# ===== arg =====
batch.size=500
retry.max=5

# ===== log =====
logging.level.com.liuliu.example.decode=INFO

# ===== Actuator / Micrometer =====
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
# 暴露 prometheus 指标端点：http://host:port/actuator/prometheus
