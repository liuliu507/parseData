# ===== 单测 profile：scan 定时任务屏蔽 + 空扫描目录 =====
# 定时拉到 9999999 秒（≈115 天），避免单测运行时真的触发 @Scheduled
scan.intervalSeconds=9999999

# 扫描根目录指向空文件夹，扫描不会碰真实 pcap 文件
scan.rootDir=${user.dir}/src/test/resources/empty

# ===== ClickHouse =====
# 单测也连 CH（如果 CI 没起会 fail-fast，这是对的）
ch.endpoint=http://localhost:8123
ch.username=default
ch.password=${CH_PASSWORD:123456}
ch.database=pcap_db
ch.table=parseData
ch.metaTable=processed_files

# ===== 其他 =====
scan.concurrency=4
retry.max=5
batch.size=500
logging.level.com.liuliu.example.decode=WARN
